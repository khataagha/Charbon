# Charbon Unicode Keyboard - Nginx Configuration
# Serves the compiled Web application, APK/AAB downloadable artifacts, and autoindex directory.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom MIME Types for Android packages
    types {
        application/vnd.android.package-archive apk;
        application/octet-stream aab;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 3000 default_server;
        listen [::]:3000 default_server;
        server_name _;

        # Root directory (Vite production build output)
        root /app/applet/dist;
        index index.html index-files.html;

        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # 1. Downloadable APK / AAB Directory with Autoindex
        location /downloads/ {
            alias /app/applet/dist/downloads/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
            autoindex_format html;

            # CORS & Cache headers
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-cache, must-revalidate";

            # Force download headers for APK and AAB binaries
            location ~* \.apk$ {
                add_header Content-Type application/vnd.android.package-archive;
                add_header Content-Disposition 'attachment';
                add_header Access-Control-Allow-Origin *;
            }

            location ~* \.aab$ {
                add_header Content-Type application/octet-stream;
                add_header Content-Disposition 'attachment';
                add_header Access-Control-Allow-Origin *;
            }
        }

        # 2. File Explorer Index page alias
        location /files {
            alias /app/applet/dist/index-files.html;
            default_type text/html;
        }

        location /explorer {
            alias /app/applet/dist/index-files.html;
            default_type text/html;
        }

        # 3. Direct APK root download links
        location ~* \.(apk|aab)$ {
            root /app/applet/dist;
            add_header Content-Disposition 'attachment';
            add_header Access-Control-Allow-Origin *;
        }

        # 4. Single Page Application (SPA) fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
