# Standard Nginx server block for /etc/nginx/conf.d/default.conf or /etc/nginx/sites-available/charbon
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index-files.html;

    # Downloadable APK & AAB Directory
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin *;

        location ~* \.apk$ {
            add_header Content-Type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment';
        }

        location ~* \.aab$ {
            add_header Content-Type application/octet-stream;
            add_header Content-Disposition 'attachment';
        }
    }

    # Dedicated HTML Directory Index page
    location /files {
        try_files /index-files.html =404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
